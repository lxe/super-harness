name: Build & Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Create/update a GitHub Release with the built installers'
        type: boolean
        default: false
      release_tag:
        description: 'Release tag when publish_release is true (defaults to v<package.json version>)'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            os: ubuntu-latest
            dist_cmd: npm run dist:linux
          - label: macOS
            os: macos-latest
            dist_cmd: npm run dist:mac
          - label: Windows
            os: windows-latest
            dist_cmd: npm run dist:win

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Package installer (${{ matrix.label }})
        shell: bash
        run: |
          if [ -z "${CSC_LINK:-}" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          ${{ matrix.dist_cmd }}
        env:
          # Unsigned / ad-hoc builds by default; add CSC_LINK + CSC_KEY_PASSWORD secrets to sign
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p upload-artifacts
          shopt -s nullglob
          for f in release/*.AppImage release/*.deb release/*.dmg release/*.zip release/*.exe; do
            cp "$f" upload-artifacts/
          done
          ls -lh upload-artifacts/

      - name: Upload build artifact (${{ matrix.label }})
        uses: actions/upload-artifact@v4
        with:
          name: super-harness-${{ matrix.label }}
          path: upload-artifacts/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            TAG="${{ inputs.release_tag }}"
          else
            VER=$(node -p "require('./package.json').version")
            TAG="v${VER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Generate SHA256 checksums
        shell: bash
        working-directory: dist-artifacts
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Superharness ${{ steps.tag.outputs.tag }}
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          generate_release_notes: true
          body: |
            > [!WARNING]
            > **Alpha build** — macOS and Windows installers are currently unsigned.
            >
            > - **macOS**: After dragging `Superharness.app` to Applications, run `xattr -cr "/Applications/Superharness.app"` if Gatekeeper blocks opening an unsigned build.
            > - **Linux**: Make the `.AppImage` executable (`chmod +x Superharness-*.AppImage`) or install the `.deb` package (`sudo apt install ./Superharness-*.deb`).
            > - **Windows**: Run the NSIS installer or the portable `.exe`.
          files: dist-artifacts/*
