appId: co.lxe.super-harness
productName: Superharness
copyright: Copyright © Superharness Contributors
asar: false

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - resources/**/*
  - package.json
  - "!docs/**"
  - "!ios/**"
  - "!tests/**"
  - "!scripts/**"
  - "!**/*.map"

mac:
  category: public.app-category.developer-tools
  icon: resources/icon.png
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  artifactName: Superharness-${version}-mac-${arch}.${ext}

linux:
  executableName: super-harness
  category: Development
  icon: resources/icon.png
  maintainer: Superharness <noreply@github.com>
  syncDesktopName: true
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  artifactName: Superharness-${version}-linux-${arch}.${ext}

win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: Superharness-${version}-win-${arch}.${ext}

# The portable build needs its own name: with the shared win artifactName it overwrote the
# NSIS installer, so release v0.1.0 shipped only the portable .exe.
portable:
  artifactName: Superharness-${version}-win-${arch}-portable.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

publish:
  provider: github
  owner: lxe
  repo: superharness
