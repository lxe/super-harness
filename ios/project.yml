name: SuperHarness
options:
  bundleIdPrefix: com.lxe
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"

targets:
  SuperHarness:
    type: application
    platform: iOS
    sources:
      - path: SuperHarness
    info:
      path: SuperHarness/Info.plist
      properties:
        CFBundleDisplayName: Super Harness
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIUserInterfaceStyle: Dark
        UILaunchScreen:
          UIColorName: LaunchBackground
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "Super Harness finds and connects to your desktop over your local network or Tailscale."
        NSBonjourServices:
          - _superharness._tcp
        NSCameraUsageDescription: "Super Harness uses the camera to scan the pairing QR code shown on your desktop."
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "Super Harness records voice dictation and sends it to your desktop for transcription."
        NSPhotoLibraryUsageDescription: "Super Harness attaches photos and videos you select to your coding agent conversations."
        UIBackgroundModes:
          - fetch
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - com.lxe.superharness.refresh
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lxe.superharness
        DEVELOPMENT_TEAM: 9592R2Q8PP
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: SuperHarness/SuperHarness.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete

  SuperHarnessTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SuperHarnessTests
    dependencies:
      - target: SuperHarness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lxe.superharness.tests
        DEVELOPMENT_TEAM: 9592R2Q8PP
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: true
        SWIFT_STRICT_CONCURRENCY: complete

  SuperHarnessUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SuperHarnessUITests
    dependencies:
      - target: SuperHarness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lxe.superharness.uitests
        DEVELOPMENT_TEAM: 9592R2Q8PP
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: true
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_TARGET_NAME: SuperHarness

schemes:
  SuperHarness:
    build:
      targets:
        SuperHarness: all
        SuperHarnessTests: [test]
        SuperHarnessUITests: [test]
    test:
      targets:
        - SuperHarnessTests
        - SuperHarnessUITests
